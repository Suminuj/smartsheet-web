function display(r,c){const v=evalCell(sheet(),r,c);return v===undefined||v===null?'':String(v)}

function syncSelection(){address.value=cellKey(selected.r,selected.c);formula.value=getRaw(sheet(),selected.r,selected.c);grid.querySelectorAll('.cell.selected').forEach(td=>td.classList.remove('selected'));const td=grid.querySelector('[data-r="'+selected.r+'"][data-c="'+selected.c+'"]');if(td)td.classList.add('selected')}
function selectCell(r,c){selected={r,c};syncSelection();status.textContent=cellKey(r,c)+' selected'}
function editCell(r,c,initial){const td=grid.querySelector('[data-r="'+r+'"][data-c="'+c+'"]');if(!td)return;const input=document.createElement('input');input.value=initial!==undefined?initial:getRaw(sheet(),r,c);td.replaceChildren(input);input.focus();if(initial===undefined)input.select();let done=false;const finish=()=>{if(done)return;done=true;setRaw(sheet(),r,c,input.value);save();render()};input.addEventListener('blur',finish);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finish();selectCell(Math.min(workbook.rows-1,r+1),c)}else if(e.key==='Escape'){done=true;render()} });}
function applyFormula(){setRaw(sheet(),selected.r,selected.c,formula.value);save();render();selectCell(selected.r,selected.c)}
$('apply').addEventListener('click',applyFormula);formula.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyFormula()}});
function save(){try{localStorage.setItem(STORE,JSON.stringify(workbook));$('saved').textContent='Saved in this browser';status.textContent='Saved locally'}catch(e){$('saved').textContent='Local save unavailable';status.textContent='Storage full or unavailable'}}
function loadLocal(){try{const val=localStorage.getItem(STORE);if(val){const x=JSON.parse(val);if(Array.isArray(x.sheets)&&x.sheets.length)workbook=x}}catch(e){status.textContent='Could not restore saved data'}}
function renderTabs(){const t=$('tabs');t.querySelectorAll('.tab').forEach(el=>el.remove());workbook.sheets.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===workbook.active?' active':'');b.textContent=s.name;b.title='Double tap/click to rename';b.addEventListener('click',()=>{workbook.active=i;selected={r:0,c:0};render();save()});b.addEventListener('dblclick',()=>{const n=prompt('Worksheet name (max 31 characters)',s.name);if(n&&n.trim()){s.name=n.trim().slice(0,31);render();save()}});t.insertBefore(b,$('status'))})}
$('newBook').onclick=()=>{if(confirm('Create a new workbook? Download your current file first if you need a backup.')){workbook={sheets:[{name:'Sheet1',cells:{},styles:{}}],active:0,rows:START_ROWS,cols:START_COLS};selected={r:0,c:0};render();save()}};
$('addRow').onclick=()=>{workbook.rows++;render();save()};$('addCol').onclick=()=>{workbook.cols++;render();save()};
$('addSheet').onclick=()=>{workbook.sheets.push({name:'Sheet'+(workbook.sheets.length+1),cells:{},styles:{}});workbook.active=workbook.sheets.length-1;selected={r:0,c:0};render();save()};
function xlsxAvailable(){if(!window.XLSX){alert('The spreadsheet file library did not load. Check your internet connection and reload.');return false}return true}
$('download').onclick=()=>{if(!xlsxAvailable())return;try{const wb=XLSX.utils.book_new();for(const s of workbook.sheets){const ws={};for(const [ref,value] of Object.entries(s.cells)){const m=ref.match(/^([A-Z]+)(\d+)$/);if(!m)continue;const p=parseRef(ref);if(typeof value==='string'&&value.startsWith('=')){ws[ref]={t:'n',f:value.slice(1)}}else if(value!==''&&value!==null&&value!==undefined){const n=Number(value);ws[ref]=value.trim()!==''&&Number.isFinite(n)?{t:'n',v:n}:{t:'s',v:String(value)}}if(s.styles[ref]&&ws[ref])ws[ref].s={...(s.styles[ref].bold?{font:{bold:true}}:{}),...(s.styles[ref].italic?{font:{italic:true}}:{}),...(s.styles[ref].color?{font:{color:{rgb:s.styles[ref].color.replace('#','').toUpperCase()}}}:{}),...(s.styles[ref].bg?{fill:{fgColor:{rgb:s.styles[ref].bg.replace('#','').toUpperCase()}}}:{})};}ws['!ref']='A1:'+cellKey(Math.max(0,workbook.rows-1),Math.max(0,workbook.cols-1));XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31)||'Sheet')}XLSX.writeFile(wb,'SmartSheet.xlsx');status.textContent='Downloaded SmartSheet.xlsx'}catch(e){alert('Could not export workbook: '+e.message)}};
$('csv').onclick=()=>{const s=sheet();const lines=[];for(let r=0;r<workbook.rows;r++){const row=[];for(let c=0;c<workbook.cols;c++){const v=display(r,c);row.push('"'+String(v).replace(/"/g,'""')+'"')}lines.push(row.join(','))}const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(s.name||'Sheet')+'.csv';a.click();URL.revokeObjectURL(a.href);status.textContent='CSV exported'};
$('upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!xlsxAvailable()){e.target.value='';return}try{let wb;if(f.name.toLowerCase().endsWith('.csv'))wb=XLSX.read(await f.text(),{type:'string',cellFormula:true});else wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellFormula:true,cellStyles:true});const next=wb.SheetNames.map(name=>{const ws=wb.Sheets[name],cells={},styles={};for(const [ref,cell] of Object.entries(ws)){if(ref[0]==='!'||!cell)continue;if(cell.f)cells[ref]='='+cell.f;else if(cell.v!==undefined)cells[ref]=String(cell.v);if(cell.s)styles[ref]={bold:!!cell.s.font?.bold,italic:!!cell.s.font?.italic,underline:!!cell.s.font?.underline,color:cell.s.font?.color?.rgb?'#'+cell.s.font.color.rgb.slice(-6):'',bg:cell.s.fill?.fgColor?.rgb?'#'+cell.s.fill.fgColor.rgb.slice(-6):''}}return{name,cells,styles}});let maxR=START_ROWS,maxC=START_COLS;for(const s of next)for(const ref of Object.keys(s.cells)){const p=parseRef(ref);if(p){maxR=Math.max(maxR,p.r+1);maxC=Math.max(maxC,p.c+1)}}workbook={sheets:next.length?next:[{name:'Sheet1',cells:{},styles:{}}],active:0,rows:maxR,cols:maxC};selected={r:0,c:0};render();save();status.textContent='Imported '+f.name}catch(err){alert('Could not read this file. Please check that it is a valid .xlsx, .xls or .csv file.')}finally{e.target.value=''}};
function updateStyle(changes){const k=cellKey(selected.r,selected.c),s=sheet();s.styles[k]={...(s.styles[k]||{}),...changes};if(Object.values(s.styles[k]).every(v=>v===''||v===false||v===null))delete s.styles[k];render();save()}
$('bold').onclick=()=>updateStyle({bold:!sheet().styles[cellKey(selected.r,selected.c)]?.bold});
$('italic').onclick=()=>updateStyle({italic:!sheet().styles[cellKey(selected.r,selected.c)]?.italic});
$('underline').onclick=()=>updateStyle({underline:!sheet().styles[cellKey(selected.r,selected.c)]?.underline});
$('fontSize').onchange=e=>updateStyle({size:Number(e.target.value)});
$('textColor').onclick=()=>{const c=prompt('Enter text colour in hex, e.g. #167447',sheet().styles[cellKey(selected.r,selected.c)]?.color||'#167447');if(c&&/^#[0-9a-f]{6}$/i.test(c))updateStyle({color:c})};
$('cellColor').onclick=()=>{const c=prompt('Enter background colour in hex, e.g. #fff2cc',sheet().styles[cellKey(selected.r,selected.c)]?.bg||'#fff2cc');if(c&&/^#[0-9a-f]{6}$/i.test(c))updateStyle({bg:c})};
$('clearFormat').onclick=()=>{delete sheet().styles[cellKey(selected.r,selected.c)];render();save()};
loadLocal();selected={r:0,c:0};render();syncSelection();
</script>
</body></html>
